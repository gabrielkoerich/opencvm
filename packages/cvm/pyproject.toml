[project]
name = "cvm"
version = "0.1.0"
description = "Brazilian fundamentals from CVM open data: download, normalize, indicators, API"
requires-python = ">=3.13,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "dramatiq[redis]>=1.17",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "requests>=2.31",
    "apscheduler>=3.10",
    "boto3>=1.34",
    "slowapi>=0.1.9",
]

[project.scripts]
cvm = "cvm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvm"]

[dependency-groups]
dev = ["pytest>=9"]
