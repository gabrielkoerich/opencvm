name: Deploy OpenCVM

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build & deploy (default: short SHA)'
        required: false
        default: ''

concurrency:
  group: deploy-cvm
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opencvm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          TAG="$INPUT_TAG"
          [ -z "$TAG" ] && TAG="$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: packages/cvm
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ secrets.CVM_USER }}
          key: ${{ secrets.CVM_SSH_KEY }}
          port: ${{ secrets.CVM_SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,CVM_IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/cvm
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export CVM_IMAGE_TAG
            docker compose pull api worker scheduler
            docker compose up -d --no-deps api worker scheduler
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CVM_IMAGE_TAG: ${{ needs.build.outputs.tag }}
